[package]
name = "multibrowser"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
ctrlc = { version = "3.5.3", features = ["termination"] }
flate2 = "1.1.11"
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
sha2 = "0.11.1"
tar = "0.4.46"
ureq = { version = "2", default-features = false, features = ["json", "tls", "gzip"] }
xz2 = "0.1.7"
zstd = "0.14.5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
